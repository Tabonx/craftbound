import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
    id 'me.modmuss50.mod-publish-plugin' version '0.7.3'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Releases take their version from the pushed tag; every other build falls back to mod_version.
def releaseTag = System.getenv('GITHUB_REF_NAME')
ext.modVersion = releaseTag?.matches(/v\d.*/) ? releaseTag.substring(1) : mod_version

version = modVersion
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.createmod.net' }         // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id

        // Larger default dev window.
        arguments.addAll '--width', '1600', '--height', '900'

        // Create and friends live here rather than on the project, so `clientNoCreate` can leave
        // them out. Create's own POM lists the whole dev pack it tests against (JEI, FTB,
        // JourneyMap, Curios, ...), none of which resolves from these repositories, so the ':slim'
        // artifact is taken without its transitives.
        dependencies {
            runtime(project.dependencies.create("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
                transitive = false
            })
            runtime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
            runtime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
            runtime "com.tterrag.registrate:Registrate:${registrate_version}"
        }
    }

    // The same client without Create, Ponder, Flywheel or Registrate, for testing that Craftbound
    // still works when its optional dependency is absent.
    clientNoCreate {
        configure 'client'

        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll '--width', '1600', '--height', '900'
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

def jeiModules = ['CommonApi', 'Core', 'Library', 'Gui', 'Common', 'NeoForgeApi', 'NeoForge']

sourceSets {
    main {
        java {
            jeiModules.each { srcDir "vendor/jei/${it}/src/main/java" }
            exclude 'mezz/jei/neoforge/JustEnoughItems.java'
            exclude 'mezz/jei/neoforge/JustEnoughItemsClient.java'
            exclude 'mezz/jei/neoforge/JustEnoughItemsClientSafeRunner.java'
        }
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Create and its dependencies (NeoForge 1.21.1).
    // See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    // The ':slim' Create artifact is non-transitive, so Ponder/Flywheel/Registrate are declared explicitly.
    // Compiled against, never required at runtime: Create is an optional dependency of the mod.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"


    // Unit testing
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_source_version     : jei_source_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    filesMatching(['pack.mcmeta']) {
        expand replaceProperties
    }

    // JEI's own pack.mcmeta and mod icon would otherwise land on ours at the jar root.
    from('vendor/jei/Common/src/main/resources') {
        exclude 'pack.mcmeta', 'jei-icon.png'
    }

    from('vendor/jei/LICENSE.txt') {
        rename { 'LICENSE-JEI.txt' }
    }

    from('vendor/jei/NeoForge/src/main/resources/META-INF/services') {
        into 'META-INF/services'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// The release notes are the CHANGELOG section headed by the version being released, so a release
// carries its own entry rather than the whole file.
def changelogFor(String released)
{
    def notes = rootProject.file('CHANGELOG.md')
    if (!notes.exists())
        return "${mod_name} ${released}"

    def section = notes.text.split(/(?m)^## /).find { it.readLines()[0].trim() == released }
    section ? section.readLines().drop(1).join('\n').trim() : "${mod_name} ${released}"
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    version = modVersion
    displayName = "${mod_name} ${modVersion} for NeoForge ${minecraft_version}"
    type = ReleaseType.valueOf(publish_type.toUpperCase(Locale.ROOT))
    modLoaders.add('neoforge')
    changelog = providers.provider { changelogFor(modVersion) }

    github {
        repository = github_repository
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${modVersion}"
    }

    if (modrinth_id) {
        modrinth {
            projectId = modrinth_id
            accessToken = providers.gradleProperty('modrinthToken')
            minecraftVersionRange {
                start = publish_minecraft_version_start
                end = minecraft_version
            }
            requires('create')
            incompatible('jei')
        }
    }

    if (curseforge_id) {
        curseforge {
            projectId = curseforge_id
            accessToken = providers.gradleProperty('curseforgeApikey')
            minecraftVersionRange {
                start = publish_minecraft_version_start
                end = minecraft_version
            }
            javaVersions.add(JavaVersion.VERSION_21)
            requires('create')
            incompatible('jei')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
