import me.modmuss50.mpp.ReleaseType
import me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

// Releases take their version from the pushed tag. Every other build takes the version the
// changelog is currently being written for, so a dry run rehearses the release that is coming
// rather than whatever mod_version was last set to.
def releaseTag = System.getenv('GITHUB_REF_NAME')
ext.modVersion = releaseTag?.matches(/v\d.*/) ? releaseTag.substring(1) : unreleasedVersion()

// The topmost section heading in the changelog, which is the version being worked on.
def unreleasedVersion()
{
    def notes = rootProject.file('CHANGELOG.md')
    if (!notes.exists())
        return mod_version

    def heading = notes.readLines().find { it.startsWith('## ') }
    return heading ? heading.substring(3).trim() : mod_version
}

version = modVersion
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.blamejared.com' }         // JEI
    maven { url = 'https://maven.createmod.net' }         // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
}

// Every supported Minecraft version produces its own jar, so the version is part of the name.
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Each Minecraft version targets the Java that Mojang ships with it, which moved from 21 to 25.
// Gradle provisions the toolchain itself, so no local JDK has to match.
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

neoForge {
    version = neo_version

    // Parchment lags new Minecraft versions and may never cover some of them. A version without it
    // builds against the plain official names.
    if (project.hasProperty('parchment_mappings_version')) {
        parchment {
            minecraftVersion = parchment_minecraft_version
            mappingsVersion = parchment_mappings_version
        }
    }

    accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Puts Minecraft on the test classpath. The tests themselves are plain logic and never touch a
    // running game, they just name types like ResourceLocation.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id

            // Larger default dev window.
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', rootProject.file('src/generated/resources/').absolutePath,
                    '--existing', rootProject.file('src/main/resources/').absolutePath
        }
    }
}

// src/ is Stonecutter's shared source directory, linked into whichever version is active, so it is
// left at the default and only the generated resources are added.
sourceSets {
    main {
        resources {
            srcDir rootProject.file('src/generated/resources')
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// A version that is not the active one has its sources preprocessed into the build directory, and
// ModDevGradle reads that same directory while collecting the mod's folders. Gradle 9 wants the
// ordering between the two spelled out rather than inferred.
tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    dependsOn tasks.matching { it.name == 'stonecutterGenerate' }
}

// Create has no release above 1.21.1. Versions it does not cover build without it, the same way a
// player without Create installed sees a book with no Create categories.
def hasCreate = project.hasProperty('create_version')

// Readable as `//? if create` in source, for the one place where Create code sits in a file that is
// otherwise shared. Whole files that only exist for Create are excluded below instead.
stonecutter.constants.put('create', hasCreate)

// Types Mojang renamed or moved without changing what they do. The source is written in 1.21.1's
// names and rewritten per version, which keeps a pure rename from turning into conditionals in
// dozens of files. Anything whose behaviour actually changed does not belong here.
def modern = stonecutter.eval(stonecutter.current.version, '>=1.21.2')
stonecutter.replacements.string {
    direction = modern
    replace 'net.minecraft.resources.ResourceLocation', 'net.minecraft.resources.Identifier'
    replace 'ResourceLocation', 'Identifier'
    replace 'net.minecraft.client.gui.components.toasts.ToastComponent', 'net.minecraft.client.gui.components.toasts.ToastManager'
    replace 'ToastComponent', 'ToastManager'
    replace 'net.minecraft.world.level.GameRules', 'net.minecraft.world.level.gamerules.GameRules'
    replace 'net.minecraft.client.RecipeBookCategories', 'net.minecraft.world.item.crafting.RecipeBookCategories'

    // Drawing calls that only changed name, not arguments. The ones that changed shape are written
    // out in the drawing code instead.
    replace '.drawString(', '.text('
    replace '.renderFakeItem(', '.fakeItem('
    replace '.renderComponentTooltip(', '.setComponentTooltipForNextFrame('
}

// Same package as GuiGraphics, so renaming the type covers its import and every use. The lookbehind
// keeps NeoForge's own getGuiGraphics() event accessor out of it, and the methods on the type differ
// and are handled in the drawing code rather than here.
stonecutter.replacements.regex {
    direction = modern
    replace '(?<!get)\\bGuiGraphics\\b', 'GuiGraphicsExtractor', '\\bGuiGraphicsExtractor\\b', 'GuiGraphics'
}

// The Ponder integration is the one part of the mod that cannot exist without Create. PonderGate is
// deliberately not in here: it only tracks whether the book is drawing a tooltip and touches nothing
// Create owns, so the book keeps working with it on every version.
if (!hasCreate) {
    sourceSets.main.java.exclude 'com/craftbound/client/ponder/CraftboundPonderPlugin.java',
            'com/craftbound/client/ponder/PonderVisibility.java',
            'com/craftbound/client/ponder/mixin/**'
    sourceSets.main.resources.exclude 'craftbound.ponder.mixins.json'
}

dependencies {
    // JEI, required at runtime. Only the api artifacts are on the compile classpath, so reaching
    // for a JEI internal is a compile error rather than something that breaks on the next JEI or
    // Minecraft version. The one internal Craftbound still needs (the shapeless icon it hides) is
    // named as a string in the mixin instead.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Create and its dependencies, only on versions Create has a release for. A version whose
    // properties declare no create_version simply builds without the Create integration.
    // See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
    // The ':slim' Create artifact is non-transitive, so Ponder/Flywheel/Registrate are declared explicitly.
    // Compiled against, never required at runtime: Create is an optional dependency of the mod.
    if (hasCreate) {
        compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
        compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
        compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"

        // The same mods for the dev client to actually load. They have to sit on the project's runtime
        // classpath: FML is only offered that as mod files, so a jar added to a run's own
        // dependencies is a library on the classpath and never a loaded mod. localRuntime keeps them
        // out of the published metadata, so the shipped jar still only suggests Create.
        // Run with -PnoCreate to leave them out and exercise the mod without its optional dependency.
        if (!project.hasProperty('noCreate')) {
            localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
            localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
            localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
            localRuntime "com.tterrag.registrate:Registrate:${registrate_version}"
        }
    }


    // Unit testing. JEI's api is on the test compile classpath so tests can reach the pure logic in
    // classes that mention a JEI type, without those tests needing a JEI runtime.
    testCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modVersion,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_version_range      : jei_version_range,
            pack_format            : pack_format,
            ponder_mixins          : hasCreate ? "[[mixins]]\nconfig=\"${mod_id}.ponder.mixins.json\"" : ''
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    filesMatching(['pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// The release notes are the CHANGELOG section headed by the version being released, so a release
// carries its own entry rather than the whole file.
def changelogFor(String released)
{
    def notes = rootProject.file('CHANGELOG.md')
    if (!notes.exists())
        return "${mod_name} ${released}"

    def section = notes.text.split(/(?m)^## /).find { it.readLines()[0].trim() == released }
    section ? section.readLines().drop(1).join('\n').trim() : "${mod_name} ${released}"
}

// Each jar is published against exactly the Minecraft versions it was built for, which the version
// owns rather than the root: a jar for one version must never claim to cover the others.
def publishMinecraftVersions = publish_minecraft_versions.split(',').collect { it.trim() }

publishMods {
    // A rehearsal that builds and validates every payload without uploading, so a broken publish
    // shows up on a normal push instead of after a tag has been cut.
    dryRun = providers.gradleProperty('publishDryRun').map { true }.orElse(false)
    // Uploads fail transiently often enough that one bad response should not cost a re-tag.
    maxRetries = 3
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    version = modVersion
    displayName = "${mod_name} ${modVersion} for NeoForge ${minecraft_version}"
    type = ReleaseType.valueOf(publish_type.toUpperCase(Locale.ROOT))
    modLoaders.add('neoforge')
    changelog = providers.provider { changelogFor(modVersion) }

    github {
        repository = github_repository
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${modVersion}"
    }

    if (modrinth_id) {
        modrinth {
            projectId = modrinth_id
            accessToken = providers.gradleProperty('modrinthToken')
            minecraftVersions.addAll publishMinecraftVersions
            environment = ModrinthEnvironment.CLIENT_ONLY_SERVER_OPTIONAL
            if (hasCreate)
                optional('create')
            requires('jei')
        }
    }

    if (curseforge_id) {
        curseforge {
            projectId = curseforge_id
            accessToken = providers.gradleProperty('curseforgeApikey')
            minecraftVersions.addAll publishMinecraftVersions
            javaVersions.add(JavaVersion.toVersion(java_version))
            client = true
            server = false
            if (hasCreate)
                optional('create')
            requires('jei')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
