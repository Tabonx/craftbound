org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.debug=false

# Latest versions: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# The Minecraft and Neo versions must agree to get a valid artifact.
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.244
neo_version_range=[21.1.0,)
loader_version_range=[4,)

## Mod Properties

# Must match the String constant in the class annotated with @Mod.
mod_id=craftbound
mod_name=Craftbound
mod_license=MIT
# Used by local and untagged builds; releases take their version from the pushed tag.
mod_version=0.1.0
mod_group_id=com.craftbound
mod_authors=Tabonx
mod_description=Craftbound - a Create-focused recipe book overhaul.

## Publishing

# Tokens never live here: CI passes them as GITHUB_TOKEN, ORG_GRADLE_PROJECT_modrinthToken and
# ORG_GRADLE_PROJECT_curseforgeApikey.
github_repository=Tabonx/craftbound
# Leave a project id empty to skip that platform.
modrinth_id=
curseforge_id=
# stable, beta or alpha
publish_type=beta
publish_minecraft_version_start=1.21.1

## Create dependency versions (NeoForge 1.21.1)
# See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
jei_source_version=19.21.0.247
