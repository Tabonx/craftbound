org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.debug=false

## Mod Properties
# Everything here is the same on every supported Minecraft version. Anything that differs belongs
# in versions/<version>/gradle.properties instead.

# Must match the String constant in the class annotated with @Mod.
mod_id=craftbound
mod_name=Craftbound
mod_license=MIT
# Last-resort fallback only: untagged builds take the changelog's topmost version, and releases
# take theirs from the pushed tag.
mod_version=0.1.0
mod_group_id=com.craftbound
mod_authors=Tabonx
mod_description=Recipe book replacement to keep items hidden until you find the ingredients they need.

## Publishing

# Tokens never live here: CI passes them as GITHUB_TOKEN, ORG_GRADLE_PROJECT_modrinthToken and
# ORG_GRADLE_PROJECT_curseforgeApikey.
github_repository=Tabonx/craftbound
# Leave a project id empty to skip that platform.
modrinth_id=TS72AP3X
curseforge_id=1654159
# stable, beta or alpha
publish_type=beta

# Stonecutter prefers the Kotlin DSL. The Groovy scripts here are supported, just not its default.
dev.kikugie.stonecutter.hard_mode=true
