modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
${mod_icon}
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Ponder ships with Create. This config is not required, so its mixins are skipped when Create is
# absent, and it is left out entirely on Minecraft versions Create has no release for.
${ponder_mixins}

# Keeping JEI's own interface off screen is the one thing with no api behind it, so these reach into
# JEI itself. Not required: a JEI that moved them should bring its interface back, not refuse to load.
[[mixins]]
config="${mod_id}.jei.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

${create_dependency}

# The book is built on JEI's plugin system: JEI is what knows every mod's recipes, so it must load
# first and be present for the book to have anything to show.
[[dependencies.${mod_id}]]
    modId="jei"
    type="required"
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"
