modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Ponder ships with Create. This config is not required, so its mixins are skipped when Create is absent.
[[mixins]]
config="${mod_id}.ponder.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create is optional: without it the book simply has no Create categories to show. It must still
# load first, so its recipe categories are registered before the book reads them.
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="incompatible"
    reason="Craftbound embeds the recipe infrastructure it needs and cannot run alongside the full JEI mod."
    ordering="NONE"
    side="CLIENT"
