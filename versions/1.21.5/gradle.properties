# The Minecraft and Neo versions must agree to get a valid artifact.
minecraft_version=1.21.5
minecraft_version_range=[1.21.5,1.21.6)
neo_version=21.5.98
neo_version_range=[21.5.0,)
loader_version_range=[4,)

# Resource pack format for this Minecraft version. Read from the game's own version.json.
pack_format=55

# Minecraft on this version runs on this Java.
java_version=21

# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.5
parchment_mappings_version=2025.06.15

## JEI (required)
jei_version=21.4.0.27
jei_version_range=[21.4.0,)

# Create has no release for this version, so the book ships without its categories.

# The Minecraft versions this jar is published for, comma separated.
publish_minecraft_versions=1.21.5
