# The Minecraft and Neo versions must agree to get a valid artifact.
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.244
neo_version_range=[21.1.0,)
# Resource pack format for this Minecraft version.
pack_format=34
loader_version_range=[4,)

# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## JEI (required)
# The book is built on JEI's plugin system, so JEI is a hard dependency rather than an integration.
# Latest versions: https://maven.blamejared.com/mezz/jei/
jei_version=19.21.0.247
jei_version_range=[19.21.0,)

## Create dependency versions (NeoForge 1.21.1)
# See https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1
# Create has no release above 1.21.1, so no other version carries these.
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# The Minecraft versions this jar is published for, comma separated.
publish_minecraft_versions=1.21.1

# Minecraft on this version runs on this Java.
java_version=21
