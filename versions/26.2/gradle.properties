# The Minecraft and Neo versions must agree to get a valid artifact.
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2,27)
neo_version=26.2.0.63
# JEI's 26.2 builds still call ContainerScreenEvent, which NeoForge dropped after 26.2.0.20-beta, so
# JEI crashes as it starts on any newer NeoForge. Build and publish against the release above;
# add -PjeiRuntime to run the game against the last version JEI actually works with.
neo_version_jei_runtime=26.2.0.20-beta
neo_version_range=[26.2.0,)
loader_version_range=[4,)

# Resource pack format for this Minecraft version.
pack_format=88

# Parchment has no release for 26.x, so this version builds without it.

## JEI (required)
# Latest versions: https://maven.blamejared.com/mezz/jei/
jei_version=30.9.0.57
jei_version_range=[30.9.0,)

# Create has no release for this version, so the book ships without its categories.

# The Minecraft versions this jar is published for, comma separated.
publish_minecraft_versions=26.2

# Minecraft on this version runs on this Java.
java_version=25
